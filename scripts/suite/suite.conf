# Realized by @luckignolo32 (GitHub) - Creative Commons Attribution-ShareAlike 4.0 International
#
# Static configuration of the multicore test suite. This file is sourced by
# the bash entry points and regex-parsed by build_ods.py, so every setting
# must stay in the plain KEY="value" form.
#
# The branch lists were derived by hashing the section-relevant sources of
# every remote branch and keeping, in chronological order, only the branches
# whose sources differ from all previously kept ones. main is absent from the
# MPI list because its MPI sources are byte-identical to immediate.
#
# firstTry was removed from the MPI list afterwards: its kernel carries no omp
# pragma and no MPI call, and its only difference from the sequential core is
# that it allocates the two layer arrays itself instead of receiving them, so
# it is the sequential algorithm built by mpicc. Measuring it as a hybrid
# branch would have given the campaign a column that parallelizes nothing.
#

MPI_BRANCHES="Layers_Optimization Sqrt_Optimization Layers_OptimizationV2 v1-da-runnare AddParallelZone immediate Add_SIMD_Directives"
CUDA_BRANCHES="cuda-first cuda-1D cuda-shared main"
SEQ_BRANCH="main"

SLURM_PARTITION="students"
SLURM_QOS="students_limit"
SLURM_TIME_LIMIT="00:30:00"
HPC_INIT_SCRIPT="/home/guest/init-hpc.sh"

#
# CORRECTNESS_REL_TOLERANCE is relative to the magnitude of the baseline
# value, not absolute: the layer is float and the parallel reductions round
# differently at every rank and thread count, so an absolute bound of this
# size would demand bit-identical output and fail every correct run.
#
# TIMING_RESOLUTION_FLOOR is the wall clock time below which a cell stops
# measuring the program and starts measuring the process startup around it.
# C_3 and C_100 fall under it on the wider layouts, where repetitions of
# 0.00 and 0.01 seconds are recorded; the reports mark those cells instead of
# publishing the speedups computed from them.
#
RUNS_PER_TEST="5"
SEQ_RUNS_PER_TEST="5"
SUBMIT_RETRY_SECONDS="15"
SUITE_WAIT_NOTICE_RETRIES="20"
CORRECTNESS_REL_TOLERANCE="0.00001"
TIMING_RESOLUTION_FLOOR="0.02"

HYBRID_NODE_COUNTS="1 2 4"
HYBRID_LAYOUTS="1x1 1x2 2x1 2x4 4x2 4x4 4x8 8x4"
CUDA_BLOCK_SIZES="32 64 128 256 512 1024"
